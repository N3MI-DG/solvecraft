[package]
name = "solvecraft-spacemouse"
description = "SolveCraft 3D mouse input: recognises SpaceMouse devices and decodes their HID reports into motion and buttons"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The device reader (a background thread over HID); desktop builds only.
native = ["dep:async-hid", "dep:futures-lite"]

[dependencies]
async-hid = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
